AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS Public Blockchain Data Consumer Architecture with Automated Schema Discovery.
  This template extends the base architecture with Glue Crawlers that automatically
  discover and catalog new blockchain data schemas.

Parameters:
  S3Bucket:
    Description: The S3 bucket with the AWS Public Blockchain Data
    Type: String
    Default: "aws-public-blockchain"
  
  SchemaVersion:
    Type: String
    Default: "v1.0"
    Description: Default schema version for BTC/ETH
  
  SchemaVersionTON:
    Type: String
    Default: "v1.1"
    Description: Schema version for TON blockchain
  
  DiscoverySchedule:
    Type: String
    Default: "cron(0 2 ? * SUN *)"
    Description: Schedule for blockchain discovery (default weekly on Sunday at 2 AM UTC)
  
  DefaultCrawlerSchedule:
    Type: String
    Default: "daily"
    AllowedValues:
      - "1min"
      - "10min"
      - "hourly"
      - "daily"
      - "disabled"
    Description: Default schedule for per-blockchain crawlers (can be changed per-chain via Lambda)
  
  EnableAutoCrawling:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable automatic crawler scheduling

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Data Source Configuration"
        Parameters:
          - S3Bucket
          - SchemaVersion
          - SchemaVersionTON
      - Label:
          default: "Crawler Configuration"
        Parameters:
          - DiscoverySchedule
          - DefaultCrawlerSchedule
          - EnableAutoCrawling

Resources:
  # ============================================================================
  # S3 and Athena Resources
  # ============================================================================
  
  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      AccessControl: Private
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AthenaResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: ForceHTTPS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub ${AthenaResultsBucket.Arn}/*
              - !Sub ${AthenaResultsBucket.Arn}
            Condition:
              Bool:
                "aws:SecureTransport": false
      Bucket: !Ref AthenaResultsBucket

  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: AWSPublicBlockchain
      Description: AWS Public Blockchain Data
      RecursiveDeleteOption: true
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        RequesterPaysEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub s3://${AthenaResultsBucket}/results/
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

  # ============================================================================
  # IAM Roles for Glue Crawlers
  # ============================================================================
  
  GlueCrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-GlueCrawlerRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${S3Bucket}
                  - !Sub arn:aws:s3:::${S3Bucket}/*
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub ${AthenaResultsBucket.Arn}/*
        - PolicyName: GlueCatalogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:*Database*
                  - glue:*Table*
                  - glue:*Partition*
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/*
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/*/*

  # ============================================================================
  # Dynamic Database Discovery - Creates Separate DB Per Blockchain
  # ============================================================================
  
  # Lambda function that discovers new blockchains and creates databases + crawlers
  BlockchainDiscoveryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-BlockchainDiscovery
      Description: Discovers new blockchains in S3 and creates dedicated databases and crawlers
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt BlockchainDiscoveryRole.Arn
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          S3_BUCKET: !Ref S3Bucket
          SCHEMA_VERSION: !Ref SchemaVersion
          SCHEMA_VERSION_TON: !Ref SchemaVersionTON
          CRAWLER_ROLE_ARN: !GetAtt GlueCrawlerRole.Arn
          STACK_NAME: !Ref AWS::StackName
          SNS_TOPIC_ARN: !Ref CrawlerNotificationTopic
          DEFAULT_CRAWLER_SCHEDULE: !Ref DefaultCrawlerSchedule
          EVENTBRIDGE_ROLE_ARN: !GetAtt EventBridgeGlueRole.Arn
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          
          glue = boto3.client('glue')
          s3 = boto3.client('s3')
          sns = boto3.client('sns')
          events = boto3.client('events')
          
          SCHEDULE_MAP = {
              '1min': 'rate(1 minute)',
              '10min': 'rate(10 minutes)',
              'hourly': 'rate(1 hour)',
              'daily': 'rate(1 day)',
              'disabled': None
          }
          
          def handler(event, context):
              print(f"Event: {json.dumps(event)}")
              
              bucket = os.environ['S3_BUCKET']
              schema_version = os.environ['SCHEMA_VERSION']
              schema_version_ton = os.environ.get('SCHEMA_VERSION_TON', 'v1.1')
              crawler_role = os.environ['CRAWLER_ROLE_ARN']
              stack_name = os.environ['STACK_NAME']
              sns_topic = os.environ['SNS_TOPIC_ARN']
              default_schedule = os.environ.get('DEFAULT_CRAWLER_SCHEDULE', 'daily')
              eventbridge_role = os.environ['EVENTBRIDGE_ROLE_ARN']
              
              # Discover blockchain namespaces in S3
              discovered = set()
              paginator = s3.get_paginator('list_objects_v2')
              
              for version in [schema_version, schema_version_ton]:
                  try:
                      pages = paginator.paginate(
                          Bucket=bucket,
                          Prefix=f"{version}/",
                          Delimiter='/',
                          RequestPayer='requester'
                      )
                      for page in pages:
                          for prefix in page.get('CommonPrefixes', []):
                              parts = prefix['Prefix'].strip('/').split('/')
                              if len(parts) >= 2:
                                  blockchain = parts[1].lower()
                                  discovered.add(blockchain)
                  except Exception as e:
                      print(f"Error scanning {version}: {e}")
              
              print(f"Discovered blockchains: {discovered}")
              
              created_databases = []
              created_crawlers = []
              created_schedules = []
              started_crawlers = []
              
              for blockchain in discovered:
                  db_name = blockchain.lower()
                  crawler_name = f"{stack_name}-{blockchain.upper()}-Crawler"
                  schedule_name = f"{stack_name}-{blockchain.upper()}-Schedule"
                  
                  # Create database if it doesn't exist
                  try:
                      glue.get_database(Name=db_name)
                      print(f"Database {db_name} already exists")
                  except glue.exceptions.EntityNotFoundException:
                      print(f"Creating database: {db_name}")
                      glue.create_database(
                          DatabaseInput={
                              'Name': db_name,
                              'Description': f'Auto-discovered {blockchain.upper()} blockchain data'
                          }
                      )
                      created_databases.append(db_name)
                  
                  # Determine S3 path (check both schema versions)
                  s3_path = None
                  for version in [schema_version, schema_version_ton]:
                      test_prefix = f"{version}/{blockchain}/"
                      try:
                          response = s3.list_objects_v2(
                              Bucket=bucket,
                              Prefix=test_prefix,
                              MaxKeys=1,
                              RequestPayer='requester'
                          )
                          if response.get('Contents') or response.get('CommonPrefixes'):
                              s3_path = f"s3://{bucket}/{version}/{blockchain}/"
                              break
                      except Exception as e:
                          print(f"Error checking {test_prefix}: {e}")
                  
                  if not s3_path:
                      print(f"No data found for {blockchain}, skipping crawler creation")
                      continue
                  
                  # Create crawler if it doesn't exist
                  crawler_created = False
                  try:
                      glue.get_crawler(Name=crawler_name)
                      print(f"Crawler {crawler_name} already exists")
                  except glue.exceptions.EntityNotFoundException:
                      print(f"Creating crawler: {crawler_name} for {s3_path}")
                      glue.create_crawler(
                          Name=crawler_name,
                          Role=crawler_role,
                          DatabaseName=db_name,
                          Description=f'Auto-created crawler for {blockchain.upper()} blockchain',
                          Targets={
                              'S3Targets': [{'Path': s3_path}]
                          },
                          SchemaChangePolicy={
                              'UpdateBehavior': 'UPDATE_IN_DATABASE',
                              'DeleteBehavior': 'LOG'
                          },
                          RecrawlPolicy={
                              'RecrawlBehavior': 'CRAWL_NEW_FOLDERS_ONLY'
                          },
                          Configuration=json.dumps({
                              "Version": 1.0,
                              "CrawlerOutput": {
                                  "Partitions": {"AddOrUpdateBehavior": "InheritFromTable"},
                                  "Tables": {"AddOrUpdateBehavior": "MergeNewColumns"}
                              }
                          })
                      )
                      created_crawlers.append(crawler_name)
                      crawler_created = True
                  
                  # Create EventBridge schedule for crawler if it doesn't exist
                  schedule_expr = SCHEDULE_MAP.get(default_schedule)
                  if schedule_expr and crawler_created:
                      try:
                          events.describe_rule(Name=schedule_name)
                          print(f"Schedule {schedule_name} already exists")
                      except events.exceptions.ResourceNotFoundException:
                          print(f"Creating schedule: {schedule_name} with {default_schedule}")
                          events.put_rule(
                              Name=schedule_name,
                              ScheduleExpression=schedule_expr,
                              State='ENABLED',
                              Description=f'Schedule for {blockchain.upper()} crawler ({default_schedule})'
                          )
                          events.put_targets(
                              Rule=schedule_name,
                              Targets=[{
                                  'Id': f'{blockchain.upper()}CrawlerTarget',
                                  'Arn': f'arn:aws:glue:{os.environ["AWS_REGION"]}:{context.invoked_function_arn.split(":")[4]}:crawler/{crawler_name}',
                                  'RoleArn': eventbridge_role
                              }]
                          )
                          created_schedules.append(f"{schedule_name} ({default_schedule})")
                  
                  # Start the crawler on first creation
                  if crawler_created:
                      try:
                          crawler_state = glue.get_crawler(Name=crawler_name)['Crawler']['State']
                          if crawler_state == 'READY':
                              print(f"Starting crawler: {crawler_name}")
                              glue.start_crawler(Name=crawler_name)
                              started_crawlers.append(crawler_name)
                          else:
                              print(f"Crawler {crawler_name} is {crawler_state}, skipping start")
                      except Exception as e:
                          print(f"Error starting crawler {crawler_name}: {e}")
              
              # Send notification
              if created_databases or created_crawlers or created_schedules:
                  message = f"""
          Blockchain Discovery Report
          ============================
          
          Blockchains Found: {len(discovered)}
          {chr(10).join(f'  - {b}' for b in sorted(discovered))}
          
          New Databases Created: {len(created_databases)}
          {chr(10).join(f'  - {db}' for db in created_databases) if created_databases else '  None'}
          
          New Crawlers Created: {len(created_crawlers)}
          {chr(10).join(f'  - {c}' for c in created_crawlers) if created_crawlers else '  None'}
          
          New Schedules Created: {len(created_schedules)}
          {chr(10).join(f'  - {s}' for s in created_schedules) if created_schedules else '  None'}
          
          Crawlers Started: {len(started_crawlers)}
          {chr(10).join(f'  - {c}' for c in started_crawlers) if started_crawlers else '  None'}
          
          Tables will be available in Athena once crawlers complete.
          
          To change a crawler's schedule, use the CrawlerScheduleManager Lambda.
          """
                  
                  sns.publish(
                      TopicArn=sns_topic,
                      Subject=f"Blockchain Discovery: {len(discovered)} chains found",
                      Message=message
                  )
              
              return {
                  'statusCode': 200,
                  'body': json.dumps({
                      'discovered': list(discovered),
                      'created_databases': created_databases,
                      'created_crawlers': created_crawlers,
                      'created_schedules': created_schedules,
                      'started_crawlers': started_crawlers
                  })
              }

  BlockchainDiscoveryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BlockchainDiscoveryPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${S3Bucket}
                  - !Sub arn:aws:s3:::${S3Bucket}/*
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:CreateDatabase
                  - glue:GetCrawler
                  - glue:CreateCrawler
                  - glue:StartCrawler
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt GlueCrawlerRole.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref CrawlerNotificationTopic
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:PutTargets
                  - events:DescribeRule
                  - events:DeleteRule
                  - events:RemoveTargets
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${AWS::StackName}-*
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt EventBridgeGlueRole.Arn

  # IAM Role for EventBridge to start Glue crawlers
  EventBridgeGlueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-EventBridgeGlueRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartGlueCrawler
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:StartCrawler
                Resource: !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:crawler/${AWS::StackName}-*

  # Schedule for blockchain discovery
  BlockchainDiscoverySchedule:
    Type: AWS::Events::Rule
    Condition: EnableCrawling
    Properties:
      Name: !Sub ${AWS::StackName}-BlockchainDiscoverySchedule
      Description: Schedule for discovering new blockchains
      ScheduleExpression: !Ref DiscoverySchedule
      State: ENABLED
      Targets:
        - Arn: !GetAtt BlockchainDiscoveryFunction.Arn
          Id: BlockchainDiscoveryTarget

  BlockchainDiscoveryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BlockchainDiscoveryFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BlockchainDiscoverySchedule.Arn

  # ============================================================================
  # Custom Resource to Trigger Initial Discovery on Deployment
  # ============================================================================
  
  InitialDiscoveryTrigger:
    Type: Custom::InitialDiscovery
    DependsOn:
      - BlockchainDiscoveryFunction
      - EventBridgeGlueRole
      - GlueCrawlerRole
      - CrawlerNotificationTopic
    Properties:
      ServiceToken: !GetAtt InitialDiscoveryFunction.Arn
      DiscoveryFunctionName: !Ref BlockchainDiscoveryFunction

  InitialDiscoveryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-InitialDiscoveryTrigger
      Description: Triggers initial blockchain discovery on stack creation
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt InitialDiscoveryRole.Arn
      Timeout: 600
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import json
          
          lambda_client = boto3.client('lambda')
          
          def handler(event, context):
              print(f"Event: {json.dumps(event)}")
              
              request_type = event['RequestType']
              discovery_function = event['ResourceProperties']['DiscoveryFunctionName']
              
              try:
                  if request_type == 'Create':
                      # Invoke discovery function on stack creation
                      print(f"Invoking discovery function: {discovery_function}")
                      response = lambda_client.invoke(
                          FunctionName=discovery_function,
                          InvocationType='RequestResponse',
                          Payload=json.dumps({'trigger': 'initial_deployment'})
                      )
                      
                      payload = json.loads(response['Payload'].read())
                      print(f"Discovery response: {json.dumps(payload)}")
                      
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, 
                                      {'Result': 'Initial discovery completed'},
                                      physicalResourceId='InitialDiscovery')
                  
                  elif request_type == 'Update':
                      # Optionally re-run discovery on stack update
                      print("Stack update - skipping discovery (run manually if needed)")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                      {'Result': 'Update - no action'},
                                      physicalResourceId='InitialDiscovery')
                  
                  elif request_type == 'Delete':
                      # Nothing to clean up
                      print("Stack delete - no cleanup needed")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                      {'Result': 'Delete - no action'},
                                      physicalResourceId='InitialDiscovery')
                      
              except Exception as e:
                  print(f"Error: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED,
                                  {'Error': str(e)},
                                  physicalResourceId='InitialDiscovery')

  InitialDiscoveryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeDiscoveryPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt BlockchainDiscoveryFunction.Arn

  # ============================================================================
  # Lambda for Managing Crawler Schedules
  # ============================================================================
  
  CrawlerScheduleManagerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ScheduleManagerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:PutTargets
                  - events:DescribeRule
                  - events:DeleteRule
                  - events:RemoveTargets
                  - events:ListRules
                  - events:ListTargetsByRule
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${AWS::StackName}-*
              - Effect: Allow
                Action:
                  - glue:GetCrawler
                  - glue:ListCrawlers
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt EventBridgeGlueRole.Arn

  CrawlerScheduleManager:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-CrawlerScheduleManager
      Description: Manages crawler schedules (set, get, list, disable)
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt CrawlerScheduleManagerRole.Arn
      Timeout: 60
      Environment:
        Variables:
          STACK_NAME: !Ref AWS::StackName
          EVENTBRIDGE_ROLE_ARN: !GetAtt EventBridgeGlueRole.Arn
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          
          events = boto3.client('events')
          glue = boto3.client('glue')
          
          SCHEDULE_MAP = {
              '1min': 'rate(1 minute)',
              '10min': 'rate(10 minutes)',
              'hourly': 'rate(1 hour)',
              'daily': 'rate(1 day)'
          }
          
          def handler(event, context):
              """
              Manage crawler schedules.
              
              Actions:
                - list: List all crawler schedules
                - get: Get schedule for a specific blockchain
                - set: Set schedule for a blockchain (1min, 10min, hourly, daily)
                - disable: Disable schedule for a blockchain
              
              Example payloads:
                {"action": "list"}
                {"action": "get", "blockchain": "btc"}
                {"action": "set", "blockchain": "btc", "schedule": "hourly"}
                {"action": "disable", "blockchain": "btc"}
              """
              print(f"Event: {json.dumps(event)}")
              
              stack_name = os.environ['STACK_NAME']
              eventbridge_role = os.environ['EVENTBRIDGE_ROLE_ARN']
              region = os.environ['AWS_REGION']
              account_id = context.invoked_function_arn.split(':')[4]
              
              action = event.get('action', 'list')
              blockchain = event.get('blockchain', '').upper()
              schedule = event.get('schedule', '')
              
              if action == 'list':
                  # List all schedules
                  rules = events.list_rules(NamePrefix=f"{stack_name}-")['Rules']
                  schedules = []
                  for rule in rules:
                      if rule['Name'].endswith('-Schedule'):
                          chain = rule['Name'].replace(f"{stack_name}-", "").replace("-Schedule", "")
                          schedules.append({
                              'blockchain': chain,
                              'schedule': rule.get('ScheduleExpression', 'unknown'),
                              'state': rule.get('State', 'unknown')
                          })
                  return {'statusCode': 200, 'schedules': schedules}
              
              elif action == 'get':
                  if not blockchain:
                      return {'statusCode': 400, 'error': 'blockchain is required'}
                  rule_name = f"{stack_name}-{blockchain}-Schedule"
                  try:
                      rule = events.describe_rule(Name=rule_name)
                      return {
                          'statusCode': 200,
                          'blockchain': blockchain,
                          'schedule': rule.get('ScheduleExpression'),
                          'state': rule.get('State')
                      }
                  except events.exceptions.ResourceNotFoundException:
                      return {'statusCode': 404, 'error': f'No schedule found for {blockchain}'}
              
              elif action == 'set':
                  if not blockchain:
                      return {'statusCode': 400, 'error': 'blockchain is required'}
                  if schedule not in SCHEDULE_MAP:
                      return {'statusCode': 400, 'error': f'Invalid schedule. Use: {list(SCHEDULE_MAP.keys())}'}
                  
                  rule_name = f"{stack_name}-{blockchain}-Schedule"
                  crawler_name = f"{stack_name}-{blockchain}-Crawler"
                  
                  # Verify crawler exists
                  try:
                      glue.get_crawler(Name=crawler_name)
                  except glue.exceptions.EntityNotFoundException:
                      return {'statusCode': 404, 'error': f'Crawler {crawler_name} not found'}
                  
                  # Create or update rule
                  events.put_rule(
                      Name=rule_name,
                      ScheduleExpression=SCHEDULE_MAP[schedule],
                      State='ENABLED',
                      Description=f'Schedule for {blockchain} crawler ({schedule})'
                  )
                  events.put_targets(
                      Rule=rule_name,
                      Targets=[{
                          'Id': f'{blockchain}CrawlerTarget',
                          'Arn': f'arn:aws:glue:{region}:{account_id}:crawler/{crawler_name}',
                          'RoleArn': eventbridge_role
                      }]
                  )
                  return {
                      'statusCode': 200,
                      'message': f'Schedule set for {blockchain}: {schedule}',
                      'schedule_expression': SCHEDULE_MAP[schedule]
                  }
              
              elif action == 'disable':
                  if not blockchain:
                      return {'statusCode': 400, 'error': 'blockchain is required'}
                  rule_name = f"{stack_name}-{blockchain}-Schedule"
                  try:
                      # Remove targets first, then delete rule
                      targets = events.list_targets_by_rule(Rule=rule_name)['Targets']
                      if targets:
                          events.remove_targets(Rule=rule_name, Ids=[t['Id'] for t in targets])
                      events.delete_rule(Name=rule_name)
                      return {'statusCode': 200, 'message': f'Schedule disabled for {blockchain}'}
                  except events.exceptions.ResourceNotFoundException:
                      return {'statusCode': 404, 'error': f'No schedule found for {blockchain}'}
              
              else:
                  return {'statusCode': 400, 'error': f'Unknown action: {action}. Use: list, get, set, disable'}

  # ============================================================================
  # Lambda for Post-Crawler Processing
  # ============================================================================
  
  CrawlerCompletionHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GlueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetCrawler
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
                Resource: '*'
        - PolicyName: SNSPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref CrawlerNotificationTopic

  CrawlerCompletionHandler:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-CrawlerCompletionHandler
      Description: Processes crawler completion events and sends notifications
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt CrawlerCompletionHandlerRole.Arn
      Timeout: 300
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref CrawlerNotificationTopic
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime
          
          glue = boto3.client('glue')
          sns = boto3.client('sns')
          
          def handler(event, context):
              print(f"Received event: {json.dumps(event)}")
              
              crawler_name = event['detail']['crawlerName']
              state = event['detail']['state']
              
              if state != 'Succeeded':
                  print(f"Crawler {crawler_name} did not succeed. State: {state}")
                  return
              
              # Get crawler details
              crawler = glue.get_crawler(Name=crawler_name)
              database_name = crawler['Crawler']['DatabaseName']
              
              # Get tables in the database
              tables_response = glue.get_tables(DatabaseName=database_name)
              tables = tables_response.get('TableList', [])
              
              # Build notification message
              message_parts = [
                  f"Crawler Completion Report",
                  f"========================",
                  f"Crawler: {crawler_name}",
                  f"Database: {database_name}",
                  f"Completion Time: {datetime.now().isoformat()}",
                  f"",
                  f"Discovered Tables: {len(tables)}",
                  f""
              ]
              
              for table in tables:
                  table_name = table['Name']
                  column_count = len(table['StorageDescriptor']['Columns'])
                  location = table['StorageDescriptor']['Location']
                  
                  message_parts.append(f"  • {table_name}")
                  message_parts.append(f"    - Columns: {column_count}")
                  message_parts.append(f"    - Location: {location}")
                  message_parts.append("")
              
              message = "\n".join(message_parts)
              
              # Send SNS notification
              sns.publish(
                  TopicArn=os.environ['SNS_TOPIC_ARN'],
                  Subject=f"Glue Crawler Completed: {crawler_name}",
                  Message=message
              )
              
              print(f"Notification sent for crawler: {crawler_name}")
              return {
                  'statusCode': 200,
                  'body': json.dumps('Processing complete')
              }

  # ============================================================================
  # EventBridge Rule for Crawler State Changes
  # ============================================================================
  
  CrawlerStateChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-CrawlerStateChange
      Description: Trigger Lambda when crawlers complete
      EventPattern:
        source:
          - aws.glue
        detail-type:
          - Glue Crawler State Change
        detail:
          state:
            - Succeeded
            - Failed
          crawlerName:
            - prefix: !Ref AWS::StackName
      State: ENABLED
      Targets:
        - Arn: !GetAtt CrawlerCompletionHandler.Arn
          Id: CrawlerCompletionHandlerTarget

  CrawlerCompletionHandlerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CrawlerCompletionHandler
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CrawlerStateChangeRule.Arn

  # ============================================================================
  # SNS Topic for Notifications
  # ============================================================================
  
  CrawlerNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-CrawlerNotifications
      DisplayName: Blockchain Crawler Notifications
      KmsMasterKeyId: alias/aws/sns

  # ============================================================================
  # SSM Parameters (matching original template naming convention)
  # ============================================================================
  
  BucketNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: public-blockchain-bucket
      Description: AWS Public Blockchain S3 bucket
      Type: String
      Value: !Ref S3Bucket

  SchemaVersionParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: public-blockchain-schema-version
      Description: AWS Public Blockchain Schema Version
      Type: String
      Value: !Ref SchemaVersion

  SchemaVersionParameterTON:
    Type: AWS::SSM::Parameter
    Properties:
      Name: public-blockchain-schema-version-ton
      Description: AWS Public Blockchain Schema Version for TON
      Type: String
      Value: !Ref SchemaVersionTON

Conditions:
  EnableCrawling: !Equals [!Ref EnableAutoCrawling, "true"]

Outputs:
  AthenaResultsBucket:
    Description: S3 bucket for Athena query results
    Value: !Ref AthenaResultsBucket
    Export:
      Name: !Sub ${AWS::StackName}-AthenaResultsBucket

  AthenaWorkgroup:
    Description: Athena workgroup for blockchain queries
    Value: !Ref AthenaWorkgroup
    Export:
      Name: !Sub ${AWS::StackName}-AthenaWorkgroup

  BlockchainDiscoveryFunction:
    Description: Lambda function for discovering new blockchains
    Value: !Ref BlockchainDiscoveryFunction
    Export:
      Name: !Sub ${AWS::StackName}-DiscoveryFunction

  CrawlerScheduleManager:
    Description: Lambda function for managing crawler schedules (invoke with action list/get/set/disable)
    Value: !Ref CrawlerScheduleManager
    Export:
      Name: !Sub ${AWS::StackName}-ScheduleManager

  CrawlerNotificationTopicArn:
    Description: SNS topic for crawler notifications
    Value: !Ref CrawlerNotificationTopic
    Export:
      Name: !Sub ${AWS::StackName}-NotificationTopic

  GlueCrawlerRoleArn:
    Description: IAM role ARN for Glue crawlers
    Value: !GetAtt GlueCrawlerRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-CrawlerRole
