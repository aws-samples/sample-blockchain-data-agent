AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS Public Blockchain Data Consumer Architecture with Automated Schema Discovery.
  This template extends the base architecture with Glue Crawlers that automatically
  discover and catalog new blockchain data schemas.

Parameters:
  S3Bucket:
    Description: The S3 bucket with the AWS Public Blockchain Data
    Type: String
    Default: "aws-public-blockchain"
  
  SchemaVersion:
    Type: String
    Default: "v1.0"
    Description: Default schema version for BTC/ETH
  
  SchemaVersionTON:
    Type: String
    Default: "v1.1"
    Description: Schema version for TON blockchain
  
  CrawlerSchedule:
    Type: String
    Default: "cron(0 2 ? * SUN *)"
    Description: Schedule for running crawlers (default weekly on Sunday at 2 AM UTC)
  
  EnableAutoCrawling:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable automatic crawler scheduling

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Data Source Configuration"
        Parameters:
          - S3Bucket
          - SchemaVersion
          - SchemaVersionTON
      - Label:
          default: "Crawler Configuration"
        Parameters:
          - CrawlerSchedule
          - EnableAutoCrawling

Resources:
  # ============================================================================
  # S3 and Athena Resources
  # ============================================================================
  
  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      AccessControl: Private
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AthenaResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: ForceHTTPS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub ${AthenaResultsBucket.Arn}/*
              - !Sub ${AthenaResultsBucket.Arn}
            Condition:
              Bool:
                "aws:SecureTransport": false
      Bucket: !Ref AthenaResultsBucket

  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: AWSPublicBlockchain
      Description: AWS Public Blockchain Data
      RecursiveDeleteOption: true
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        RequesterPaysEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub s3://${AthenaResultsBucket}/results/
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

  # ============================================================================
  # IAM Roles for Glue Crawlers
  # ============================================================================
  
  GlueCrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-GlueCrawlerRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${S3Bucket}
                  - !Sub arn:aws:s3:::${S3Bucket}/*
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub ${AthenaResultsBucket.Arn}/*
        - PolicyName: GlueCatalogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:*Database*
                  - glue:*Table*
                  - glue:*Partition*
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/*
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/*/*

  # ============================================================================
  # Dynamic Database Discovery - Creates Separate DB Per Blockchain
  # ============================================================================
  
  # Lambda function that discovers new blockchains and creates databases + crawlers
  BlockchainDiscoveryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-BlockchainDiscovery
      Description: Discovers new blockchains in S3 and creates dedicated databases and crawlers
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt BlockchainDiscoveryRole.Arn
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          S3_BUCKET: !Ref S3Bucket
          SCHEMA_VERSION: !Ref SchemaVersion
          SCHEMA_VERSION_TON: !Ref SchemaVersionTON
          CRAWLER_ROLE_ARN: !GetAtt GlueCrawlerRole.Arn
          STACK_NAME: !Ref AWS::StackName
          SNS_TOPIC_ARN: !Ref CrawlerNotificationTopic
          KNOWN_BLOCKCHAINS: "btc,eth,ton"
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          
          glue = boto3.client('glue')
          s3 = boto3.client('s3')
          sns = boto3.client('sns')
          
          def handler(event, context):
              print(f"Event: {json.dumps(event)}")
              
              bucket = os.environ['S3_BUCKET']
              schema_version = os.environ['SCHEMA_VERSION']
              crawler_role = os.environ['CRAWLER_ROLE_ARN']
              stack_name = os.environ['STACK_NAME']
              sns_topic = os.environ['SNS_TOPIC_ARN']
              known_blockchains = set(os.environ['KNOWN_BLOCKCHAINS'].split(','))
              
              # Discover blockchain namespaces in S3
              discovered = set()
              paginator = s3.get_paginator('list_objects_v2')
              
              for version in [schema_version, os.environ.get('SCHEMA_VERSION_TON', 'v1.1')]:
                  try:
                      pages = paginator.paginate(
                          Bucket=bucket,
                          Prefix=f"{version}/",
                          Delimiter='/',
                          RequestPayer='requester'
                      )
                      for page in pages:
                          for prefix in page.get('CommonPrefixes', []):
                              parts = prefix['Prefix'].strip('/').split('/')
                              if len(parts) >= 2:
                                  blockchain = parts[1].lower()
                                  discovered.add(blockchain)
                  except Exception as e:
                      print(f"Error scanning {version}: {e}")
              
              print(f"Discovered blockchains: {discovered}")
              print(f"Known blockchains: {known_blockchains}")
              
              # Find new blockchains
              new_blockchains = discovered - known_blockchains
              print(f"New blockchains to process: {new_blockchains}")
              
              created_databases = []
              created_crawlers = []
              
              for blockchain in new_blockchains:
                  db_name = blockchain.lower()
                  crawler_name = f"{stack_name}-{blockchain.upper()}-Crawler"
                  
                  # Create database if it doesn't exist
                  try:
                      glue.get_database(Name=db_name)
                      print(f"Database {db_name} already exists")
                  except glue.exceptions.EntityNotFoundException:
                      print(f"Creating database: {db_name}")
                      glue.create_database(
                          DatabaseInput={
                              'Name': db_name,
                              'Description': f'Auto-discovered {blockchain.upper()} blockchain data'
                          }
                      )
                      created_databases.append(db_name)
                  
                  # Determine S3 path (check both schema versions)
                  s3_path = None
                  for version in [schema_version, os.environ.get('SCHEMA_VERSION_TON', 'v1.1')]:
                      test_prefix = f"{version}/{blockchain}/"
                      try:
                          response = s3.list_objects_v2(
                              Bucket=bucket,
                              Prefix=test_prefix,
                              MaxKeys=1,
                              RequestPayer='requester'
                          )
                          if response.get('Contents') or response.get('CommonPrefixes'):
                              s3_path = f"s3://{bucket}/{version}/{blockchain}/"
                              break
                      except Exception as e:
                          print(f"Error checking {test_prefix}: {e}")
                  
                  if not s3_path:
                      print(f"No data found for {blockchain}, skipping crawler creation")
                      continue
                  
                  # Create crawler if it doesn't exist
                  try:
                      glue.get_crawler(Name=crawler_name)
                      print(f"Crawler {crawler_name} already exists")
                  except glue.exceptions.EntityNotFoundException:
                      print(f"Creating crawler: {crawler_name} for {s3_path}")
                      glue.create_crawler(
                          Name=crawler_name,
                          Role=crawler_role,
                          DatabaseName=db_name,
                          Description=f'Auto-created crawler for {blockchain.upper()} blockchain',
                          Targets={
                              'S3Targets': [{'Path': s3_path}]
                          },
                          SchemaChangePolicy={
                              'UpdateBehavior': 'UPDATE_IN_DATABASE',
                              'DeleteBehavior': 'LOG'
                          },
                          RecrawlPolicy={
                              'RecrawlBehavior': 'CRAWL_NEW_FOLDERS_ONLY'
                          },
                          Configuration=json.dumps({
                              "Version": 1.0,
                              "CrawlerOutput": {
                                  "Partitions": {"AddOrUpdateBehavior": "InheritFromTable"},
                                  "Tables": {"AddOrUpdateBehavior": "MergeNewColumns"}
                              }
                          })
                      )
                      created_crawlers.append(crawler_name)
                      
                      # Start the crawler immediately
                      print(f"Starting crawler: {crawler_name}")
                      glue.start_crawler(Name=crawler_name)
              
              # Send notification if new blockchains were discovered
              if created_databases or created_crawlers:
                  message = f"""
          New Blockchain Discovery Report
          ================================
          
          New Databases Created: {len(created_databases)}
          {chr(10).join(f'  - {db}' for db in created_databases) if created_databases else '  None'}
          
          New Crawlers Created: {len(created_crawlers)}
          {chr(10).join(f'  - {c}' for c in created_crawlers) if created_crawlers else '  None'}
          
          Crawlers have been started automatically.
          Tables will be available in Athena once crawlers complete.
          """
                  
                  sns.publish(
                      TopicArn=sns_topic,
                      Subject=f"New Blockchains Discovered: {', '.join(new_blockchains)}",
                      Message=message
                  )
              
              return {
                  'statusCode': 200,
                  'body': json.dumps({
                      'discovered': list(discovered),
                      'new_blockchains': list(new_blockchains),
                      'created_databases': created_databases,
                      'created_crawlers': created_crawlers
                  })
              }

  BlockchainDiscoveryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BlockchainDiscoveryPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${S3Bucket}
                  - !Sub arn:aws:s3:::${S3Bucket}/*
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:CreateDatabase
                  - glue:GetCrawler
                  - glue:CreateCrawler
                  - glue:StartCrawler
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt GlueCrawlerRole.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref CrawlerNotificationTopic

  # Schedule for blockchain discovery
  BlockchainDiscoverySchedule:
    Type: AWS::Events::Rule
    Condition: EnableCrawling
    Properties:
      Name: !Sub ${AWS::StackName}-BlockchainDiscoverySchedule
      Description: Schedule for discovering new blockchains
      ScheduleExpression: !Ref CrawlerSchedule
      State: ENABLED
      Targets:
        - Arn: !GetAtt BlockchainDiscoveryFunction.Arn
          Id: BlockchainDiscoveryTarget

  BlockchainDiscoveryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BlockchainDiscoveryFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BlockchainDiscoverySchedule.Arn

  # ============================================================================
  # Per-Blockchain Crawlers (for existing chains)
  # ============================================================================
  
  BTCBlockchainCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub ${AWS::StackName}-BTC-Crawler
      Role: !GetAtt GlueCrawlerRole.Arn
      DatabaseName: !Ref GlueDatabaseBTC
      Description: Crawler for Bitcoin blockchain data
      Targets:
        S3Targets:
          - Path: !Sub s3://${S3Bucket}/${SchemaVersion}/btc/
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
      RecrawlPolicy:
        RecrawlBehavior: CRAWL_NEW_FOLDERS_ONLY
      Configuration: |
        {
          "Version": 1.0,
          "CrawlerOutput": {
            "Partitions": {"AddOrUpdateBehavior": "InheritFromTable"}
          }
        }

  ETHBlockchainCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub ${AWS::StackName}-ETH-Crawler
      Role: !GetAtt GlueCrawlerRole.Arn
      DatabaseName: !Ref GlueDatabaseETH
      Description: Crawler for Ethereum blockchain data
      Targets:
        S3Targets:
          - Path: !Sub s3://${S3Bucket}/${SchemaVersion}/eth/
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
      RecrawlPolicy:
        RecrawlBehavior: CRAWL_NEW_FOLDERS_ONLY

  TONBlockchainCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub ${AWS::StackName}-TON-Crawler
      Role: !GetAtt GlueCrawlerRole.Arn
      DatabaseName: !Ref GlueDatabaseTON
      Description: Crawler for TON blockchain data
      Targets:
        S3Targets:
          - Path: !Sub s3://${S3Bucket}/${SchemaVersionTON}/ton/
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
      RecrawlPolicy:
        RecrawlBehavior: CRAWL_NEW_FOLDERS_ONLY

  # ============================================================================
  # Glue Databases (Existing Blockchains)
  # ============================================================================
  
  GlueDatabaseBTC:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: btc
        Description: Bitcoin blockchain data

  GlueDatabaseETH:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: eth
        Description: Ethereum blockchain data

  GlueDatabaseTON:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: ton
        Description: TON blockchain data

  # ============================================================================
  # EventBridge Rules for Scheduled Crawling
  # ============================================================================

  BTCCrawlerSchedule:
    Type: AWS::Events::Rule
    Condition: EnableCrawling
    Properties:
      Name: !Sub ${AWS::StackName}-BTCCrawlerSchedule
      Description: Schedule for BTC crawler
      ScheduleExpression: !Ref CrawlerSchedule
      State: ENABLED
      Targets:
        - Arn: !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:crawler/${BTCBlockchainCrawler}
          Id: BTCCrawlerTarget
          RoleArn: !GetAtt EventBridgeGlueRole.Arn

  ETHCrawlerSchedule:
    Type: AWS::Events::Rule
    Condition: EnableCrawling
    Properties:
      Name: !Sub ${AWS::StackName}-ETHCrawlerSchedule
      Description: Schedule for ETH crawler
      ScheduleExpression: !Ref CrawlerSchedule
      State: ENABLED
      Targets:
        - Arn: !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:crawler/${ETHBlockchainCrawler}
          Id: ETHCrawlerTarget
          RoleArn: !GetAtt EventBridgeGlueRole.Arn

  TONCrawlerSchedule:
    Type: AWS::Events::Rule
    Condition: EnableCrawling
    Properties:
      Name: !Sub ${AWS::StackName}-TONCrawlerSchedule
      Description: Schedule for TON crawler
      ScheduleExpression: !Ref CrawlerSchedule
      State: ENABLED
      Targets:
        - Arn: !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:crawler/${TONBlockchainCrawler}
          Id: TONCrawlerTarget
          RoleArn: !GetAtt EventBridgeGlueRole.Arn

  # ============================================================================
  # IAM Role for EventBridge to Start Crawlers
  # ============================================================================
  
  EventBridgeGlueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartGlueCrawler
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:StartCrawler
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:crawler/*

  # ============================================================================
  # Lambda for Post-Crawler Processing
  # ============================================================================
  
  CrawlerCompletionHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GlueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetCrawler
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
                Resource: '*'
        - PolicyName: SNSPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref CrawlerNotificationTopic

  CrawlerCompletionHandler:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-CrawlerCompletionHandler
      Description: Processes crawler completion events and sends notifications
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt CrawlerCompletionHandlerRole.Arn
      Timeout: 300
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref CrawlerNotificationTopic
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime
          
          glue = boto3.client('glue')
          sns = boto3.client('sns')
          
          def handler(event, context):
              print(f"Received event: {json.dumps(event)}")
              
              crawler_name = event['detail']['crawlerName']
              state = event['detail']['state']
              
              if state != 'Succeeded':
                  print(f"Crawler {crawler_name} did not succeed. State: {state}")
                  return
              
              # Get crawler details
              crawler = glue.get_crawler(Name=crawler_name)
              database_name = crawler['Crawler']['DatabaseName']
              
              # Get tables in the database
              tables_response = glue.get_tables(DatabaseName=database_name)
              tables = tables_response.get('TableList', [])
              
              # Build notification message
              message_parts = [
                  f"Crawler Completion Report",
                  f"========================",
                  f"Crawler: {crawler_name}",
                  f"Database: {database_name}",
                  f"Completion Time: {datetime.now().isoformat()}",
                  f"",
                  f"Discovered Tables: {len(tables)}",
                  f""
              ]
              
              for table in tables:
                  table_name = table['Name']
                  column_count = len(table['StorageDescriptor']['Columns'])
                  location = table['StorageDescriptor']['Location']
                  
                  message_parts.append(f"  • {table_name}")
                  message_parts.append(f"    - Columns: {column_count}")
                  message_parts.append(f"    - Location: {location}")
                  message_parts.append("")
              
              message = "\n".join(message_parts)
              
              # Send SNS notification
              sns.publish(
                  TopicArn=os.environ['SNS_TOPIC_ARN'],
                  Subject=f"Glue Crawler Completed: {crawler_name}",
                  Message=message
              )
              
              print(f"Notification sent for crawler: {crawler_name}")
              return {
                  'statusCode': 200,
                  'body': json.dumps('Processing complete')
              }

  # ============================================================================
  # EventBridge Rule for Crawler State Changes
  # ============================================================================
  
  CrawlerStateChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-CrawlerStateChange
      Description: Trigger Lambda when crawlers complete
      EventPattern:
        source:
          - aws.glue
        detail-type:
          - Glue Crawler State Change
        detail:
          state:
            - Succeeded
            - Failed
          crawlerName:
            - prefix: !Ref AWS::StackName
      State: ENABLED
      Targets:
        - Arn: !GetAtt CrawlerCompletionHandler.Arn
          Id: CrawlerCompletionHandlerTarget

  CrawlerCompletionHandlerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CrawlerCompletionHandler
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CrawlerStateChangeRule.Arn

  # ============================================================================
  # SNS Topic for Notifications
  # ============================================================================
  
  CrawlerNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-CrawlerNotifications
      DisplayName: Blockchain Crawler Notifications
      KmsMasterKeyId: alias/aws/sns

  # ============================================================================
  # SSM Parameters
  # ============================================================================
  
  BucketNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /blockchain/s3-bucket
      Description: AWS Public Blockchain S3 bucket
      Type: String
      Value: !Ref S3Bucket

  SchemaVersionParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /blockchain/schema-version
      Description: AWS Public Blockchain Schema Version
      Type: String
      Value: !Ref SchemaVersion

  SchemaVersionParameterTON:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /blockchain/schema-version-ton
      Description: AWS Public Blockchain Schema Version for TON
      Type: String
      Value: !Ref SchemaVersionTON

Conditions:
  EnableCrawling: !Equals [!Ref EnableAutoCrawling, "true"]

Outputs:
  AthenaResultsBucket:
    Description: S3 bucket for Athena query results
    Value: !Ref AthenaResultsBucket
    Export:
      Name: !Sub ${AWS::StackName}-AthenaResultsBucket

  AthenaWorkgroup:
    Description: Athena workgroup for blockchain queries
    Value: !Ref AthenaWorkgroup
    Export:
      Name: !Sub ${AWS::StackName}-AthenaWorkgroup

  BlockchainDiscoveryFunction:
    Description: Lambda function for discovering new blockchains
    Value: !Ref BlockchainDiscoveryFunction
    Export:
      Name: !Sub ${AWS::StackName}-DiscoveryFunction

  CrawlerNotificationTopicArn:
    Description: SNS topic for crawler notifications
    Value: !Ref CrawlerNotificationTopic
    Export:
      Name: !Sub ${AWS::StackName}-NotificationTopic

  GlueCrawlerRoleArn:
    Description: IAM role ARN for Glue crawlers
    Value: !GetAtt GlueCrawlerRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-CrawlerRole

  BTCDatabase:
    Description: Glue database for Bitcoin data
    Value: !Ref GlueDatabaseBTC

  ETHDatabase:
    Description: Glue database for Ethereum data
    Value: !Ref GlueDatabaseETH

  TONDatabase:
    Description: Glue database for TON data
    Value: !Ref GlueDatabaseTON
